 
 <!DOCTYPE html>

    <!-- مكتبة Tailwind CSS المحلي الشغال أوفلاين -->
    <script src="./js/tailwindcss.js"></script>
    
    <!-- ملف الـ CSS المحلي بتاع فلو بايت -->
    <script src="./js/flowbite.min.js"></script>
    <link rel="stylesheet" href="./css/flowbite.min.css">
    
    <script>
        // 1. هات الثيم اللي مخزنه في الكاش (لو مفيش خليه دارك مثلاً)
        const savedTheme = localStorage.getItem('theme') || 'dark';

        // 2. حط الكلاس فوراً على الـ html قبل ما الصفحة تحمل عشان ما تحصلش رمشة
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // 3. إعداد تايليند الثابت اللي لازم يكون موجود عشان يفهم النظام
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <!-- مكتبة Driver.js للتوجيه والجولات -->
   <link rel="stylesheet" href="css/driver.css">
<script src="js/driver.iife.js"></script>
    <!-- Application CSS Files -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ========================================== -->
<!-- 🚀 شاشة السبلاش الفخمة والاحترافية -->
<!-- ========================================== -->
<div id="splash-screen" class="pro-splash-fullscreen-wrapper">
    
    <!-- 1. طبقة الفيديو الخلفية (مع صورة احتياطية بدلاً من النص) -->

    </video>
    <!-- 2. طبقة التعتيم -->
    <div class="pro-video-overlay"></div>
    <!-- 3. بطاقة المحتوى (اللوجو، العنوان، واللودر) فوق الفيديو -->
    <div class="pro-splash-card-floating">
        <!-- اللوجو الخاص بك -->
     <div class="pro-logo-wrapper-static flex flex-col items-center">
    <img src="icons/logo.jfif" alt="smart-pro-pos" class="pro-splash-logo-img">
    <div class="pro-logo-glow"></div>
    <h2 class="pro-splash-title mt-3">smart-pro-pos</h2>
</div>
        <h1 class="pro-splash-title">سمارت برو للبرمجيات    </h1>
         <h1 class="pro-splash-title">ترحب بكم </h1>
        <!-- التايتل المتغير من تحت خالص -->
     <p id="splash-dynamic-subtitle" class="pro-splash-subtitle transition-all duration-500 font-bold text-amber-400">جارِ تحميل لوحة التحكم وتجهيز النظام...</p>
        <div class="pro-modern-loader">
            <span></span>
            <span></span>
            <span></span>

</div>

  
      <!-- حاوية مركز الإشعارات -->
<div id="notifications-panel" class="hidden fixed top-20 right-5 z-50 w-80 md:w-96 bg-slate-900/95 backdrop-blur-xl border border-slate-700/50 rounded-2xl shadow-2xl overflow-hidden transition-all duration-300">
    
    <!-- رأس لوحة الإشعارات -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800 bg-slate-800/50">
        <h3 class="notif-header-title text-white text-base">الإشعارات الواردة</h3>
        <button onclick="clearAllNotifications()" class="text-xs text-indigo-400 hover:text-indigo-300 transition">تحديد الكل مقروء</button>
    </div>

    <!-- قائمة الإشعارات -->
    <div id="notifications-list" class="max-h-80 overflow-y-auto divide-y divide-slate-800/60 p-2 space-y-2">
        
        <!-- عنصر إشعارات تجريبي (ثابت زي ما اتفقنا) -->
        <div class="notif-item p-3 rounded-xl hover:bg-slate-800/40 transition cursor-pointer">
            <div class="flex items-start justify-between">
                <h4 class="notif-title text-sm text-slate-100 font-bold">تحديث النظام الجديد</h4>
                <span class="notif-time text-[10px] text-slate-400">منذ 5 دقائق</span>
            </div>
            <p class="notif-message text-xs text-slate-300 mt-1">تمت إضافة مميزات جديدة لنظام الفحص والفتح التلقائي بنجاح.</p>
        </div>

        <div class="notif-item p-3 rounded-xl hover:bg-slate-800/40 transition cursor-pointer">
            <div class="flex items-start justify-between">
                <h4 class="notif-title text-sm text-slate-100 font-bold">تنبيه أمني</h4>
                <span class="notif-time text-[10px] text-slate-400">منذ ساعة</span>
            </div>
            <p class="notif-message text-xs text-slate-300 mt-1">تم تسجيل الدخول بنجاح من جهاز جديد.</p>
        </div>

    </div>

    <!-- تذليل اللوحة -->
    <div class="p-2 text-center border-t border-slate-800 bg-slate-800/30">
        <button onclick="toggleNotifications()" class="text-xs text-slate-400 hover:text-white transition">إغلاق اللوحة</button>
    </div>
</div>
<!-- حاوية رسائل التوست (تظهر من الأسفل) -->
    <div id="toast-container"></div>

    <!-- نافذة التأكيد المخصصة (Custom Confirm Modal) -->

        <div class="confirm-card">
            <h3 id="confirm-title">تأكيد</h3>
            <p id="confirm-msg">هل أنت متاكد من الإجراء؟</p>
            <div class="confirm-actions">
                <button id="confirm-ok-btn" class="confirm-btn ok">موافق</button>
                <button id="confirm-cancel-btn" class="confirm-btn cancel">إلغاء</button>
            </div>
        </div>
    </div>
   <!-- 1. فحص الاتصال (تم التعديل ليتناسب مع التطبيق المحلي الأوفلاين) -->
    <script>
        // التطبيق يعمل محلياً، يمكن تنبيه المستخدم فقط بدل إيقافه إن لم يكن متصلاً بشيء اختياري
        window.addEventListener('offline', () => {
            console.warn("أنت تعمل الآن في وضع الأوفلاين المحلي الكامل.");
        });
    </script>
    <!-- 2. أدوات التصحيح والموبايل (Eruda) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
   <script>
    if (typeof eruda !== 'undefined') {
        eruda.init();
        eruda.get('entryBtn').hide(); // بيخفي الزرار العائم ويسيب المكتبة شغالة في الخلفية
    }
</script>
    <!-- 3. مكتبات البنية التحتية وقاعدة البيانات والأيقونات (محلية بالكامل) -->
    <script src="assets/dexie.js"></script>
     
    <!-- 4. مكتبات المعالجة الخارجية (Excel & PDF & Images) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="assets/jspdf.umd.min.js"></script>
    <script src="assets/html2canvas.min.js"></script>

    <!-- 5. تسجيل الـ Service Worker الخاص بـ PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('PWA Service Worker Ready:', reg.scope);

                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('New app version available! Refreshing...');
                                    window.location.reload();
                                }
                            });
                        });
                    })
                    .catch(err => console.error('PWA SW Registration Failed:', err));
            });
        }
    </script>

    <!-- 6. ملف التشغيل الرئيسي للتطبيق (Module) -->
      <script type="module" src="js/home-script.js"></script>
       <script type="module" src="js/admin-script.js"></script>
   
  
</body>
